name: Desktop Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux
            arch: x64
            artifact_name: linux-x64
            package_globs: |
              dist/*.deb
              dist/*.rpm

          - os: windows-latest
            target: windows
            arch: x64
            artifact_name: windows-x64
            package_globs: |
              dist/*.exe
              dist/*.msi

          - os: macos-latest
            target: macos
            arch: arm64
            artifact_name: macos-arm64
            package_globs: |
              dist/*.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            rpm patchelf dpkg-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable desktop target
        run: flutter config --enable-${{ matrix.target }}-desktop

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        if: matrix.target == 'linux'
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        if: matrix.target == 'linux'
        run: flutter test

      - name: Build release
        run: flutter build ${{ matrix.target }} --release

      - name: Verify macOS binary architecture
        if: matrix.target == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          BIN="build/macos/Build/Products/Release/space_weather.app/Contents/MacOS/space_weather"
          file "$BIN"
          ARCHS="$(lipo -archs "$BIN")"
          echo "lipo archs: $ARCHS"
          echo "$ARCHS" | grep -qw arm64

      - name: Install Fastforge
        run: dart pub global activate fastforge

      - name: Package Linux (deb + rpm)
        if: matrix.target == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$PATH:$HOME/.pub-cache/bin"
          fastforge package --platform linux --targets deb
          fastforge package --platform linux --targets rpm
          ls -lah dist/

      - name: Install Windows packaging tools
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          choco install innosetup wixtoolset --no-progress -y
          # Ensure WiX bin is on PATH for this job
          $wixRoots = @(
            "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin",
            "${env:ProgramFiles(x86)}\WiX Toolset v3.11\bin",
            "${env:ProgramFiles}\WiX Toolset v3.14\bin"
          )
          foreach ($root in $wixRoots) {
            if (Test-Path $root) {
              echo $root | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
              break
            }
          }

      - name: Package Windows (exe + msi)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:Path = "$env:Path;$env:USERPROFILE\.pub-cache\bin;$env:LOCALAPPDATA\Pub\Cache\bin"

          fastforge package --platform windows --targets exe

          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$').Matches.Groups[1].Value
          $version = $version.Split('+')[0]
          $projectDir = (Resolve-Path .).Path
          $sourceDir = Join-Path $projectDir "build\windows\x64\runner\Release"
          $outDir = Join-Path $projectDir "dist"

          & powershell -NoProfile -ExecutionPolicy Bypass `
            -File "windows\packaging\msi\pack.ps1" `
            -Version $version `
            -SourceDir $sourceDir `
            -OutDir $outDir `
            -ProjectDir $projectDir

          Get-ChildItem dist | Format-Table Name, Length

      - name: Install appdmg
        if: matrix.target == 'macos'
        run: npm install -g appdmg

      - name: Package macOS (dmg)
        if: matrix.target == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$PATH:$HOME/.pub-cache/bin"
          fastforge package --platform macos --targets dmg
          ls -lah dist/

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: space_weather-${{ matrix.artifact_name }}
          path: ${{ matrix.package_globs }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish / attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.package_globs }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
