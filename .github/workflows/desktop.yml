name: Desktop Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux
            arch: x64
            artifact_name: linux-x64
            artifact_path: build/linux/x64/release/bundle

          - os: windows-latest
            target: windows
            arch: x64
            artifact_name: windows-x64
            artifact_path: build/windows/x64/runner/Release

          - os: macos-latest
            target: macos
            arch: arm64
            artifact_name: macos-arm64
            artifact_path: build/macos/Build/Products/Release/space_weather.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable desktop target
        run: flutter config --enable-${{ matrix.target }}-desktop

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        if: matrix.target == 'linux'
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        if: matrix.target == 'linux'
        run: flutter test

      - name: Build release
        run: flutter build ${{ matrix.target }} --release

      - name: Verify macOS binary architecture
        if: matrix.target == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          BIN="${{ matrix.artifact_path }}/Contents/MacOS/space_weather"
          file "$BIN"
          ARCHS="$(lipo -archs "$BIN")"
          echo "lipo archs: $ARCHS"
          case "${{ matrix.arch }}" in
            arm64)
              echo "$ARCHS" | grep -qw arm64
              ;;
            *)
              echo "Unknown arch ${{ matrix.arch }}" >&2
              exit 1
              ;;
          esac

      - name: Package artifact (Linux)
        if: matrix.target == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//;s/+.*//')"
          OUT="space_weather-${VERSION}-${{ matrix.artifact_name }}"
          mkdir -p dist
          cp -a "${{ matrix.artifact_path }}" "dist/${OUT}"
          (cd dist && tar -czf "${OUT}.tar.gz" "${OUT}")
          echo "ASSET_PATH=dist/${OUT}.tar.gz" >> "$GITHUB_ENV"

      - name: Package artifact (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$').Matches.Groups[1].Value
          $version = $version.Split('+')[0]
          $out = "space_weather-$version-${{ matrix.artifact_name }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse -Force "${{ matrix.artifact_path }}" "dist/$out"
          Compress-Archive -Path "dist/$out\*" -DestinationPath "dist/$out.zip" -Force
          "ASSET_PATH=dist/$out.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Package artifact (macOS)
        if: matrix.target == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//;s/+.*//')"
          OUT="space_weather-${VERSION}-${{ matrix.artifact_name }}"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            "${{ matrix.artifact_path }}" \
            "dist/${OUT}.zip"
          echo "ASSET_PATH=dist/${OUT}.zip" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: space_weather-${{ matrix.artifact_name }}
          path: ${{ env.ASSET_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish / attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET_PATH }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
